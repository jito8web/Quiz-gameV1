<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate"> <!-- Evite , les traductions automatiques de google  -->
    <title>Quiz Game </title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="container">

        <!-- START -->
        <div class="screen active" id="start-screen">
            <h1>Quiz Times</h1>
            <p>Tester Votre connaissance ici</p>
            <button id="start-btn">Start Quiz</button>
        </div>

        <!-- QUIZ -->
        <div class="screen" id="quiz-screen">
            <div class="quiz-header">
                <h2 id="question-text">Question goes here</h2>
                <div id="timer">10</div>
                <div class="quiz-info">
                    <p>
                        Question <span id="current-question">1</span> of
                        <span id="total-questions">20</span>
                    </p>
                    <p>
                        Score : <span id="score">0</span>
                    </p>
                </div>

                <div id="answers-container" class="answers-container"></div>

                <div class="progress-bar">
                    <div id="progress" class="progress"></div>
                </div>
            </div>
        </div>

        <!-- RESULT -->
        <div id="result-screen" class="screen">
            <h1>Quiz Resultat</h1>

            <div class="result-info">
                <p>
                    Your score <span id="final-score">0</span>
                    out of <span id="max-score">20</span>
                </p>

                <div id="result-message">Good Job!</div>
            </div>

            <button id="restart-btn">Restart Quiz</button>
        </div>

    </div>
    <script src="script.js"></script>

</body>


</html>
